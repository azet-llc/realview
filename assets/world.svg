<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="360" rx="14" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Closed loop: every 0.4 s the policy steers and the world model dreams what it sees next</text>
  <g font-size="14" fill="#0f172a">
    <!-- logs -->
    <rect x="24" y="84" width="150" height="84" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="99" y="114" text-anchor="middle" font-weight="700">Real drives</text>
    <text x="99" y="134" text-anchor="middle" font-size="12" fill="#475569">camera + speed</text>
    <text x="99" y="150" text-anchor="middle" font-size="12" fill="#475569">+ yaw rate logs</text>
    <!-- warp -->
    <rect x="24" y="212" width="150" height="84" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="99" y="242" text-anchor="middle" font-weight="700">Off-route views</text>
    <text x="99" y="262" text-anchor="middle" font-size="12" fill="#475569">ground-plane warp</text>
    <text x="99" y="278" text-anchor="middle" font-size="12" fill="#475569">of the same frames</text>
    <!-- world model -->
    <rect x="236" y="130" width="200" height="120" rx="12" fill="#0f172a"/>
    <text x="336" y="166" text-anchor="middle" font-weight="700" fill="#ffffff">World model</text>
    <text x="336" y="188" text-anchor="middle" font-size="12" fill="#cbd5e1">23M mean-flow transformer</text>
    <text x="336" y="206" text-anchor="middle" font-size="12" fill="#cbd5e1">last 0.4 s of tokens + pose</text>
    <text x="336" y="224" text-anchor="middle" font-size="12" fill="#cbd5e1">→ next 0.4 s of tokens</text>
    <!-- policy -->
    <rect x="500" y="84" width="170" height="84" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="585" y="114" text-anchor="middle" font-weight="700">Steering policy</text>
    <text x="585" y="134" text-anchor="middle" font-size="12" fill="#475569">reads encoder tokens, never the pose</text>
    <text x="585" y="150" text-anchor="middle" font-size="12" fill="#475569">cloned, then RL</text>
    <!-- kinematics -->
    <rect x="500" y="212" width="170" height="84" rx="10" fill="#fef9c3" stroke="#fde047"/>
    <text x="585" y="242" text-anchor="middle" font-weight="700">Kinematic model</text>
    <text x="585" y="262" text-anchor="middle" font-size="12" fill="#475569">yaw rate → offset, heading</text>
    <text x="585" y="278" text-anchor="middle" font-size="12" fill="#475569">scores lane keeping</text>
    <!-- painter -->
    <rect x="740" y="130" width="196" height="120" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="838" y="166" text-anchor="middle" font-weight="700">RealView v0.1</text>
    <text x="838" y="188" text-anchor="middle" font-size="12" fill="#475569">paints the dreamed tokens</text>
    <text x="838" y="206" text-anchor="middle" font-size="12" fill="#475569">for you to watch.</text>
    <text x="838" y="224" text-anchor="middle" font-size="12" fill="#475569">Not part of the loop</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M99 168V208" marker-end="url(#a)"/>
    <path d="M174 126H205V170H232" marker-end="url(#a)"/>
    <path d="M174 254H205V210H232" marker-end="url(#a)"/>
    <path d="M436 160H468V126H496" marker-end="url(#a)"/>
    <path d="M585 168V208" marker-end="url(#a)"/>
    <path d="M500 254H468V220H440" marker-end="url(#a)"/>
    <path d="M436 190H736" stroke-dasharray="5 5" marker-end="url(#a)"/>
  </g>
  <g font-size="12" fill="#475569">
    <text x="204" y="322" text-anchor="middle">training data</text>
    <text x="446" y="118">tokens</text>
    <text x="596" y="192">yaw rate</text>
    <text x="446" y="278">pose</text>
  </g>
  <text x="585" y="322" text-anchor="middle" font-size="12" fill="#b91c1c">more than 1.2 m off the recorded path = out of lane</text>
</svg>
